services:
  airconnect:
    image: ghcr.io/giuseppe99barchetta/airconnect:latest
    container_name: airconnect
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 20s
    environment:
      # Comma-separated Chromecast names to hide, e.g. Studio,Sala,Proiettore
      AIRCONNECT_EXCLUDE_DEVICES: ${AIRCONNECT_EXCLUDE_DEVICES:-}
    volumes:
      - ./config.music-assistant.xml:/config.xml:ro
    command:
      - -Z
      - -x
      - /config.xml
      - --profile
      - music-assistant
      - --metrics-port
      - "9876"
      - -r
      - -d
      - all=info
    logging:
      driver: local
      options:
        max-size: 10m
        max-file: "3"
